[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "magicbox-lock"
version = "0.2.0"
description = "AES-256 file containers with computational or guarded key access"
readme = "README.md"
requires-python = ">=3.11"
license = "CC0-1.0"
dependencies = ["cryptography>=46.0.0"]

[project.scripts]
magicbox = "magicbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
